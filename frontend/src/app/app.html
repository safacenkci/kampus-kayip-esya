<app-site-header />

<main class="page" id="icerik" tabindex="-1">
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <p class="footer-brand">Kampüs Kayıp-Eşya</p>
    <p class="muted">
      Aksaray Üniversitesi öğrencileri için. İletişim bilgisi, ilan sahiplenilene kadar gizli kalır.
    </p>
  </div>
</footer>

<!-- Dar ekranda ana gezinme: alt sekme çubuğu -->
<nav class="tabbar" aria-label="Alt gezinme">
  <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="11" cy="11" r="7" />
      <path d="m16.2 16.2 4.3 4.3" />
    </svg>
    <span>İlanlar</span>
  </a>
  <a routerLink="/kaybettim" routerLinkActive="is-active" class="tab-lost">
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="9" />
      <path d="M9 9.2 15 15M15 9.2 9 15" />
    </svg>
    <span>Kaybettim</span>
  </a>
  <a routerLink="/buldum" routerLinkActive="is-active" class="tab-found">
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="9" />
      <path d="m8.3 12.3 2.6 2.6 4.8-5.2" />
    </svg>
    <span>Buldum</span>
  </a>
</nav>
