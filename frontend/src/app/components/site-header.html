<a class="skip" href="#icerik">İçeriğe geç</a>

<header class="topbar">
  <div class="topbar-inner">
    <a routerLink="/" class="brand" aria-label="Kampüs Kayıp-Eşya ana sayfa">
      <span class="brand-mark" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M11.6 3.2 20 4.4l1.2 8.4-8.5 8.5a2 2 0 0 1-2.8 0l-6.2-6.2a2 2 0 0 1 0-2.8z" />
          <circle cx="16.2" cy="8.2" r="1.6" fill="currentColor" stroke="none" />
        </svg>
      </span>
      <span class="brand-copy">
        <strong>Kayıp&nbsp;Eşya</strong>
        <small>Aksaray Üniversitesi</small>
      </span>
    </a>

    <nav class="topbar-nav" aria-label="Ana gezinme">
      <a
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        İlanlar
      </a>
      <a routerLink="/kaybettim" routerLinkActive="is-active" class="btn btn-lost btn-sm">
        Kaybettim
      </a>
      <a routerLink="/buldum" routerLinkActive="is-active" class="btn btn-found btn-sm"> Buldum </a>
    </nav>

    <button
      type="button"
      class="theme-btn"
      (click)="toggleTheme()"
      [attr.aria-label]="themeLabel() + '. Değiştirmek için tıkla.'"
      [title]="themeLabel()"
    >
      @switch (choice()) {
        @case ('light') {
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4.2" />
            <path
              d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"
            />
          </svg>
        }
        @case ('dark') {
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5" />
          </svg>
        }
        @default {
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="2.5" y="4.5" width="19" height="13" rx="2.2" />
            <path d="M8.5 21h7" />
          </svg>
        }
      }
    </button>
  </div>
</header>
