<header class="topbar">
  <div class="topbar-inner">
    <a routerLink="/" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28">
          <rect x="3" y="6" width="26" height="20" rx="4" fill="currentColor" opacity="0.18"/>
          <path d="M8 12h16M8 16.5h11M8 21h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="24" cy="9" r="3.2" fill="#e8b86d"/>
        </svg>
      </span>
      <span class="brand-copy">
        <strong>Kampüs Kayıp-Eşya</strong>
        <small>Kayıp ve bulunan ilan panosu</small>
      </span>
    </a>

    <nav class="topbar-nav">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">İlanlar</a>
      <a routerLink="/yeni" routerLinkActive="is-active" class="btn btn-primary btn-compact">Yeni ilan</a>
    </nav>
  </div>
</header>
