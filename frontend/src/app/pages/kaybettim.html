<section class="story" data-kind="lost">
  <a routerLink="/" class="back">
    <span aria-hidden="true">←</span>
    Panoya dön
  </a>

  <header class="story-hero">
    <span class="story-badge">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="7" />
        <path d="m16.2 16.2 4.3 4.3M8.8 8.8l4.4 4.4M13.2 8.8l-4.4 4.4" />
      </svg>
      Kaybettim
    </span>
    <h1>{{ editId() ? copy.editTitle : copy.title }}</h1>
    <p class="lede">{{ editId() ? copy.editLede : copy.lede }}</p>
  </header>

  <app-notice-wizard kind="lost" [editId]="editId()" />
</section>
